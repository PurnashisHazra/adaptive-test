# Optional production overlay: TLS + static SPA in front of the API.
#
# 1. Build frontend: cd frontend && npm ci && npm run build
# 2. Copy deploy/nginx.prod.conf.example → deploy/nginx.prod.conf and set YOUR_DOMAIN
# 3. Issue certs on the host (see deploy/SSL.md), paths below assume default Let's Encrypt layout
# 4. Set CORS_ORIGINS in .env or compose override to https://YOUR_DOMAIN
#
# Run:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.ssl.yml up -d --build

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
