# Example nginx site for testhub.emgc.in:
# - Static SPA from document root (Vite dist)
# - /api/* → FastAPI (uvicorn/gunicorn on loopback)
#
# Copy fragments into your real server block, then: nginx -t && systemctl reload nginx
# Adjust root and upstream port (8000) to match your server.

server {
    listen 443 ssl http2;
    server_name testhub.emgc.in;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    root /var/www/testhub_emgc_usr/data/www/testhub.emgc.in;
    index index.html;

    # API — must exist or POST /api/auth/login returns 404 from nginx
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — deep links and refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
